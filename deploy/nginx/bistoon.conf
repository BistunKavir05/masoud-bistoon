# نمونه‌ی پیکربندی nginx برای بیستون (برنامه روی 127.0.0.1:3000 گوش می‌دهد).
# در این حالت در تنظیمات برنامه: COOKIE_SECURE=true  و  TRUST_PROXY=loopback

server {
    listen 80;
    server_name bistoon.example.ir;           # ← نام دامنه/میزبان خودتان
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name bistoon.example.ir;           # ← همان نام

    ssl_certificate     /etc/ssl/bistoon/fullchain.pem;   # ← گواهی سازمان
    ssl_certificate_key /etc/ssl/bistoon/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # هم‌خوان با BODY_LIMIT برنامه (پیش‌فرض 16mb): فایل‌های ورود MS Project/پشتیبان
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        # مهم: Host با پورت اصلی بماند؛ برنامه Origin درخواست‌های تغییردهنده را با Host مقایسه می‌کند.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
