async function pxLoad(f){if(!f)return;if(!isA())return denied();let rows;
 try{if(/\.csv$/i.test(f.name))rows=csvParse(await f.text());else{await xLoadLib();const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''})}}

  cols.forEach(([k,j])=>{const v=r[j];if(v===''||v==null||String(v).trim()==='')return;if(k=='_name'){name=String(v).trim();return}
